name: bridge
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: moex-bridge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Wait for the open
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bridge.js
